name: Java CI with Maven and Checkstyle

# Triggers the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Downloads your code onto the GitHub server
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Installs Java 11
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Runs Maven Checkstyle and Tests
    # If Checkstyle fails, this command fails, and GitHub blocks the code!
    - name: Run Code Checks and Tests
      run: mvn clean verify
