name: Build and Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers the build whenever you push a tag like v1.0, v1.1, etc.

permissions:
  contents: write # Allows the script to create a Release page

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Fat JARs with Maven
      run: mvn clean package

    - name: Create GitHub Release and Upload JARs
      uses: softprops/action-gh-release@v2
      with:
        files: |
          target/server.jar
          target/client.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}